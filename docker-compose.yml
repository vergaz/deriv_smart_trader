version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: deriv_trader_postgres
    environment:
      POSTGRES_DB: deriv_smart_trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - deriv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deriv_trader_redis
    ports:
      - "6379:6379"
    networks:
      - deriv_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: deriv_trader_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://trader:secure_password_2024@postgres:5432/deriv_smart_trader
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      DERIV_APP_ID: ${DERIV_APP_ID}
      DERIV_API_URL: https://api.deriv.com
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deriv_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: deriv_trader_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - deriv_network
    restart: unless-stopped

networks:
  deriv_network:
    driver: bridge

volumes:
  postgres_data:
